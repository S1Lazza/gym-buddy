<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Buddy</title>
<meta name="theme-color" content="#0e1012">
<meta name="description" content="Personal workout tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1012; --surface:#171a1e; --surface2:#1f2328; --line:#2a2f36;
  --ink:#eef0f2; --ink2:#a7aeb7; --ink3:#6e7681;
  --accent:#c6f432; --accent-ink:#0e1205; --accent-soft:rgba(198,244,50,.12); --accent-line:rgba(198,244,50,.45);
  --danger:#ff6b5e; --old:#8a929c;
  --r:16px;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 150px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
header.top{margin:4px 0 10px}
.brand{display:flex;align-items:center;gap:6px;font:700 17px/1 var(--cond);letter-spacing:.03em;color:var(--ink2)}
.brand svg{width:18px;height:18px;color:var(--accent)}
.pagetitle{font:700 44px/1 var(--cond);letter-spacing:.01em;margin:6px 0 16px}
.pagetitle:empty{display:none}
.pill{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.dot.ok{background:var(--accent)} .dot.busy{background:#f5c542} .dot.err{background:var(--danger)}
.banner{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:15px;color:var(--ink2)}
.banner.warn{border-color:#f5c54255;color:#f5d27a}
.banner.acc{border-color:var(--accent-line);background:var(--accent-soft);color:var(--ink)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:14px}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 13px;font-size:15px;border-radius:10px}
h2{font:600 15px/1.2 var(--sans);color:var(--ink2);margin:22px 2px 10px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.tag.acc{background:var(--accent);color:var(--accent-ink)}
.tag.old{background:#8a929c1f;color:var(--old)}
/* week strip */
.week{display:block;width:100%;text-align:left;margin:2px 0 18px}
.week .chg{font:600 14px var(--sans);font-style:normal;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:3px 10px;vertical-align:middle;margin-left:6px}
.wkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px;max-height:52vh;overflow:auto}
.wk{border:1px solid var(--line);border-radius:12px;padding:14px 6px;text-align:center;background:var(--surface2)}
.wk b{display:block;font:700 24px/1 var(--cond)}
.wk small{display:block;font-size:11px;color:var(--ink3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wk.on small{color:#0e1205b3}
.wk.add{background:none;border-style:dashed;color:var(--ink2)}
.week .big{font:700 44px/1 var(--cond);letter-spacing:.01em}
.week .big span{color:var(--accent)}
.week .of{color:var(--ink2);font-size:15px;margin-top:4px}
.week .wphase{color:var(--accent);font-weight:600;font-size:15px;margin-top:2px}
.ticks{display:flex;gap:3px;margin-top:12px}
.ticks i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.ticks i.past{background:#c6f43266}
.ticks i.now{background:var(--accent)}
/* day list */
.daycard{display:flex;width:100%;text-align:left;align-items:center;gap:12px;padding:16px}
.daycard .t{font:700 26px/1 var(--cond);letter-spacing:.01em}
.daycard .sub{font-size:14px;color:var(--ink3);margin-top:4px}
.daycard .chev{margin-left:auto;font-size:24px;color:var(--ink3)}
.daycard.suggest{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daycard.suggest .sub,.daycard.suggest .chev{color:#0e1205b3}
.daycard .next{font-size:13px;font-weight:700;margin-left:auto;padding:3px 10px;border-radius:999px;background:var(--accent-ink);color:var(--accent)}
.daycard.suggest .chev{margin-left:8px}
/* targets */
.targets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.tg{font-size:14px;color:var(--ink2);border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:8px;padding:3px 9px;white-space:nowrap}
.tg b{font:700 17px/1 var(--cond);color:var(--accent);letter-spacing:.02em}
/* workout header */
.whead{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:4px 0 12px;margin:-4px 0 4px}
.whead .t{font:700 34px/1 var(--cond)}
.whead .sub{color:var(--ink2);font-size:14px;margin-top:4px}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.count{font:700 18px/1 var(--cond);color:var(--accent);white-space:nowrap}
.count span{color:var(--ink3);font-weight:600}
/* exercise card */
.ex.done{border-color:var(--accent-line)}
.ex .name{font:700 22px/1.1 var(--cond);flex:1;letter-spacing:.01em}
.badge-done{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.lbl{font:700 14px/1 var(--cond);color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:4px 6px;min-width:28px;text-align:center}
.lbl.plain{background:var(--surface2);color:var(--ink2)}
.tip{font-size:14px;color:var(--ink3);font-style:italic;margin-top:4px}
.last{font-size:14px;background:var(--bg);border-radius:12px;padding:10px 12px;margin:12px 0 6px}
.last .k{color:var(--ink2);font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.last .k span{color:var(--ink3);font-weight:500}
.last .n{color:var(--ink2);font-style:italic;white-space:pre-wrap;margin-top:6px}
.last .why{color:var(--ink3);font-size:13px;margin-top:6px}
.sp{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.sp span{font:600 16px/1 var(--cond);background:var(--surface2);border-radius:7px;padding:5px 7px;color:var(--ink);font-variant-numeric:tabular-nums}
.sp span small{font:500 12px var(--sans);color:var(--ink3);margin-left:3px}
.sp.old span{color:var(--old)}
.sets{display:grid;grid-template-columns:26px 1fr 1fr 62px 52px;gap:7px;align-items:center;margin-top:10px}
textarea{field-sizing:content;min-height:42px}
.bwrow{display:grid;grid-template-columns:auto 84px auto;gap:8px;align-items:center;margin-top:10px}
.bwrow input{width:100%;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--bg);text-align:center;font:600 20px/1 var(--cond);font-variant-numeric:tabular-nums}
.bwrow input.on{color:var(--accent);border-color:var(--accent-line)}
.bwrow input:focus{outline:none;border-color:var(--ink2)}
.bwrow label{font-size:14px;color:var(--ink2)}.bwrow span{font-size:13px;color:var(--ink3)}
.bwrow small{grid-column:1/-1;font-size:12.5px;color:var(--ink3);line-height:1.35}
.sets .h{font-size:13px;color:var(--ink3);text-align:center}
.sets .i{font:700 17px/1 var(--cond);color:var(--ink3);text-align:center}
.sets input{width:100%;height:48px;border-radius:11px;border:1px solid var(--line);background:var(--bg);text-align:center;font:600 22px/1 var(--cond);padding:0 4px;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.sets input::placeholder{color:#59606a;font-weight:500}
.sets input:focus{outline:none;border-color:var(--ink2)}
.chk{height:48px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);font-size:20px;color:var(--ink3)}
.chk.next{border-color:var(--accent);color:var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sets .i.on{color:var(--accent)}
.sets input.on{color:var(--accent);border-color:var(--accent-line)}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;resize:none;min-height:44px;font-size:15px}
textarea:focus{outline:none;border-color:var(--ink2)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.iconbtn{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);font-size:20px}
.iconbtn:active{background:var(--surface2)}
.menu{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#0e1012f2;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;padding:10px 0 9px;font-size:13px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
/* timer */
#timer{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));display:none;justify-content:center;z-index:19;padding:0 10px}
#timer .in{max-width:540px;width:100%;background:var(--surface2);border:1px solid var(--accent-line);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px #000a;position:relative;overflow:hidden}
#timer .bar{position:absolute;left:0;bottom:0;height:3px;margin:0;border-radius:0;background:var(--accent);transition:width .25s linear}
#timer .time{font:700 32px/1 var(--cond);font-variant-numeric:tabular-nums;min-width:76px;color:var(--accent)}
#timer .what{flex:1;font-size:13px;color:var(--ink2);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timer.go .in{background:var(--accent);color:var(--accent-ink)}
#timer.go .time,#timer.go .what{color:var(--accent-ink)}
/* modal */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal .sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
#modal h3{margin:0 0 10px;font:700 22px/1.1 var(--cond)}
#modal input[type=text]{width:100%;height:48px;border-radius:11px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
#modal .acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
/* history */
.hitem{display:block;width:100%;text-align:left}
.hitem .d{font:700 22px/1 var(--cond)}
.hrows{margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px}
.hrows .e{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrows .b{font:600 16px/1.2 var(--cond);text-align:right;font-variant-numeric:tabular-nums}
.hrows .b small{font:500 12px var(--sans);color:var(--ink3)}
/* progress */
select{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font:700 20px var(--cond)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chartbox{position:relative}
[id^="chart"] svg{display:block;width:100%;font-family:var(--sans)}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:7px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-110%);display:none;font-weight:600;line-height:1.35}
.cmp{padding-top:12px}
.cmpname{font:700 20px/1.1 var(--cond)}
.cmp.dim .cmpname{color:var(--ink2)}
.cmpstats{display:flex;gap:16px;margin:8px 0 6px}
.cmpstats span{font:700 22px/1 var(--cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.cmpstats small{display:block;font:600 12px var(--sans);color:var(--ink3);margin-bottom:3px}
.cmpstats em{font:600 14px var(--cond);font-style:normal;color:var(--ink3)}
.cmpstats .up{color:var(--accent)}
.seg{display:flex;gap:8px;margin:14px 0 12px}
.seg .btn{flex:1}
.exrow{padding:14px 16px}
.exrow .t{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg{margin-left:auto;font:700 20px/1 var(--cond);color:var(--ink2);white-space:nowrap}
.chg.up{color:var(--accent)}
.chg + .chev{margin-left:10px}
.mustitle{font:700 20px/1.1 var(--cond)}
.musnav{margin:8px 0 6px}
.muswk{font:700 16px var(--cond);color:var(--accent);text-align:center;flex:1}
.iconbtn:disabled{opacity:.25}
.musrow{display:grid;grid-template-columns:86px 1fr 58px;gap:10px;align-items:center;padding:6px 0}
.musname{font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.musbar{position:relative;height:12px;border-radius:6px;background:var(--surface2);overflow:visible}
.musbar .zone{position:absolute;top:0;bottom:0;background:#c6f43226;border-left:1px dashed #c6f43266;border-right:1px dashed #c6f43266}
.musbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px}
.musbar .plan{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.musnum{font:700 17px var(--cond);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.musnum small{font:600 14px var(--cond);color:var(--ink3)}
.pushcard{border-color:var(--accent-line);background:var(--accent-soft)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:10px 4px;border-top:1px solid var(--line);vertical-align:top}
table.t tr:first-child td{border-top:0}
table.t td:first-child{white-space:nowrap;color:var(--ink2);width:64px;padding-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stats .card{margin:0;padding:11px}
.stats .k{font-size:13px;color:var(--ink3);font-weight:600}
.stats .v{font:700 27px/1.05 var(--cond);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats .v small{font:600 15px var(--cond);color:var(--ink3)}
.stats .v.up{color:var(--accent)}
/* program */
.pex{display:grid;grid-template-columns:36px 1fr auto;gap:3px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;align-items:start}
.pex:first-child{border-top:0;padding-top:2px}
.pex .nm{font-weight:600}
.pex .s{font:700 19px/1.1 var(--cond);text-align:right;white-space:nowrap}
.pex .sub{grid-column:2/4;color:var(--ink3);font-size:13px}
.pex .sub .lastline{color:var(--ink2)}
.phase{display:flex;gap:10px;font-size:14px;padding:5px 0;color:var(--ink2)}
.phase.cur{color:var(--accent);font-weight:700}
.phase .w{min-width:96px;white-space:nowrap;font-family:var(--cond);font-weight:700;font-size:16px}
pre.notes{white-space:pre-wrap;font:inherit;font-size:14px;color:var(--ink2);margin:0}
textarea.code{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:60vh;resize:vertical}
.err{color:var(--danger);font-size:14px;margin:6px 0}
details summary{cursor:pointer;color:var(--ink2);font-size:15px;margin:10px 0}
.empty{text-align:center;color:var(--ink3);padding:30px 10px}
.field{display:block;width:100%;height:50px;margin-top:6px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:17px;color:var(--ink)}
.field:focus{outline:none;border-color:var(--accent)}
body.signedout nav.tabs{display:none}
.loading{text-align:center;color:var(--ink3);padding:60px 0}
.title2{font:700 34px/1 var(--cond)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Gym Buddy</div><div class="pill" id="savestate"><span class="dot"></span><span>Connecting…</span></div></header>
  <h1 id="title" class="pagetitle"></h1>
  <div id="view"><div class="loading">Loading your training…</div></div>
</div>
<div id="timer"><div class="in"><div class="time" id="tTime">0:00</div><div class="what" id="tWhat"></div>
  <button class="btn sm ghost" id="tMinus">−15</button><button class="btn sm ghost" id="tPlus">+15</button><button class="iconbtn" id="tClose" aria-label="Stop timer">✕</button><div class="bar" id="tBar"></div></div></div>
<div id="modal"><div class="sheet" id="modalSheet"></div></div>
<nav class="tabs"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Workout</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>History</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg>Progress</button>
  <button data-tab="program"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Program</button>
</div></nav>

<script>
"use strict";
/* Gym Buddy storage: Supabase "documents" table, cached on the device and synced in the background.
   Exposes the same doc()/collection() shape the app was written against. */
window.makeStore = function(sb, uid, onStatus){
  const LSK = "gb_cache_" + uid, QK = "gb_queue_" + uid;
  const load = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
  let rows = load(LSK) || {}, queue = load(QK) || [], fromCache = true, flushing = null;
  const listeners = [];
  const split = p => { const i = p.lastIndexOf("/"); return [p.slice(0, i), p.slice(i + 1)]; };
  const docSnap = (id, d) => ({id, exists: d !== undefined, data: () => d, metadata: {fromCache, hasPendingWrites: queue.length > 0}});
  function fire(l){
    if (l.kind === "doc") l.next(docSnap(l.id, rows[l.coll + "/" + l.id]));
    else {
      const pre = l.coll + "/";
      const docs = Object.keys(rows).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(k => docSnap(k.slice(pre.length), rows[k]));
      l.next({docs, size: docs.length, empty: !docs.length, metadata: {fromCache, hasPendingWrites: queue.length > 0}});
    }
  }
  const emit = () => setTimeout(() => listeners.forEach(fire), 0);
  const status = () => onStatus(queue.length ? (navigator.onLine === false ? "offline" : "pending") : "ok");
  async function pull(){
    const {data, error} = await sb.from("documents").select("collection,id,data");
    if (error) throw error;
    const next = {};
    data.forEach(r => next[r.collection + "/" + r.id] = r.data);
    queue.forEach(q => { const k = q.coll + "/" + q.id; if (q.op === "set") next[k] = q.data; else delete next[k]; });
    rows = next; fromCache = false; save(LSK, rows); emit();
  }
  async function flush(){
    if (flushing) return flushing;
    flushing = (async () => {
      while (queue.length) {
        const q = queue[0];
        const r = q.op === "set"
          ? await sb.from("documents").upsert({user_id: uid, collection: q.coll, id: q.id, data: q.data, updated_at: new Date().toISOString()})
          : await sb.from("documents").delete().eq("collection", q.coll).eq("id", q.id);
        if (r.error) throw r.error;
        queue.shift(); save(QK, queue);
      }
    })().finally(() => { flushing = null; });
    return flushing;
  }
  async function sync(){ try { await flush(); await pull(); status(); } catch(e){ status(); } }
  function write(op, path, data){
    const [coll, id] = split(path), k = coll + "/" + id;
    if (op === "set") rows[k] = JSON.parse(JSON.stringify(data)); else delete rows[k];
    queue = queue.filter(q => !(q.coll === coll && q.id === id));
    queue.push({op, coll, id, data: op === "set" ? rows[k] : null});
    save(LSK, rows); save(QK, queue); emit(); onStatus("busy");
    return flush().then(status, () => status());  // stays queued on the device if offline
  }
  const docRef = path => ({
    path,
    set: data => write("set", path, data),
    delete: () => write("delete", path),
    onSnapshot(next){ const [coll, id] = split(path); const l = {kind: "doc", coll, id, next}; listeners.push(l); setTimeout(() => fire(l), 0); return () => listeners.splice(listeners.indexOf(l), 1); }
  });
  const colRef = coll => ({
    path: coll,
    doc: id => docRef(coll + "/" + id),
    onSnapshot(next){ const l = {kind: "col", coll, next}; listeners.push(l); setTimeout(() => fire(l), 0); return () => listeners.splice(listeners.indexOf(l), 1); }
  });
  window.addEventListener("online", sync);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync(); });
  setInterval(() => { if (queue.length) sync(); }, 20000);
  setTimeout(sync, 0);
  return {doc: docRef, collection: colRef, sync, exportAll: () => ({app: "Gym Buddy", exportedAt: new Date().toISOString(), documents: Object.entries(rows).map(([k, data]) => { const [collection, id] = split(k); return {collection, id, data}; })})};
};

<script>
"use strict";
/* ---------- default program (used only until a program is saved) ---------- */
const DEFAULT_PROGRAM = `Program: My program

## Day A
1. Squat | 3x5 | RIR 2 | rest 3:00
2. Bench press | 3x8-10 | RIR 1-2 | rest 2:00
`;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmtDate = (s, withDow) => { const d = parseISO(s); return (withDow ? DOW[d.getDay()] + " " : "") + d.getDate() + " " + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : ""); };
const fmtNum = n => n == null ? "" : (Math.round(n*100)/100).toString();
const fmtRest = s => s == null ? "" : (s >= 60 ? Math.floor(s/60) + ":" + String(s%60).padStart(2,"0") : s + " s");
const norm = n => String(n||"").toLowerCase().replace(/\(.*?\)/g," ").replace(/[^a-z0-9]+/g," ").trim().split(" ").map(w => w.length > 3 && w.endsWith("s") ? w.slice(0,-1) : w).join(" ");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };

/* ---------- program parser ---------- */
function parseRest(t){
  t = t.trim().toLowerCase(); let m;
  if ((m = t.match(/^(\d+):(\d{1,2})/))) return +m[1]*60 + +m[2];
  if ((m = t.match(/^([\d.]+)\s*(m|min)/))) return Math.round(+m[1]*60);
  if ((m = t.match(/^(\d+)/))) return +m[1];

}
function parseProgram(text){
  const P = {name:"My program", start:null, phases:[], days:[], notes:"", errors:[]};
  let day = null, inNotes = false; const notes = [];
  text.split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); let m;
    if (inNotes) { notes.push(raw.replace(/\s+$/,"")); return; }
    if (!line) return;
    if (/^#\s+notes\b/i.test(line)) { inNotes = true; day = null; return; }
    if ((m = line.match(/^##\s+(.+)$/))) {
      const parts = m[1].split(/\s+[—–]\s+|\s+-\s+/);

      P.days.push(day); return;
    }
    if (!day) {
      if ((m = line.match(/^program\s*:\s*(.+)$/i))) P.name = m[1].trim();
      else if ((m = line.match(/^start\s*:\s*(\d{4}-\d{2}-\d{2})/i))) P.start = m[1];
      else if ((m = line.match(/^length\s*:\s*(\d+)/i))) P.length = +m[1];
      else if ((m = line.match(/^weeks?\s+(\d+)\s*(?:[-–]\s*(\d+))?\s*(\+)?\s*:\s*(.+)$/i))) {
        const parts = m[4].split("|");
        const ph = {from:+m[1], to: m[2] ? +m[2] : (m[3] ? 9999 : +m[1]), label: parts[0].trim(), sets: null};
        parts.slice(1).forEach(p => { const s = p.trim().match(/^sets\s*([x×*+\-])\s*([\d.]+)/i); if (s) ph.sets = {op: s[1] === "×" || s[1] === "*" ? "x" : s[1], v: +s[2]}; });
        P.phases.push(ph);
      }
      else notes.push(line);
      return;
    }
    if (line.startsWith(">")) { const ex = day.exercises[day.exercises.length-1]; if (ex) ex.tip = (ex.tip ? ex.tip + "\n" : "") + line.slice(1).trim(); return; }
    m = line.match(/^(?:(\d+)([A-Za-z])?[.)]?\s+)?(.+)$/);
    const fields = m[3].split("|").map(s => s.trim());
    const ex = {label: m[1] ? m[1] + (m[2] || "").toUpperCase() : "", group: m[2] ? m[1] : null, name: fields[0], sets: 3, reps: "", rir: "", rest: null, restLabel: "", start: "", tip: ""};
    if (!ex.name) { P.errors.push(`Line ${i+1}: missing exercise name`); return; }
    fields.slice(1).forEach(f => { let k;
      if (!f) return;
      if ((k = f.match(/^(\d+)\s*[x×]\s*(.+)$/i))) { ex.sets = +k[1]; ex.reps = k[2].trim().replace(/-/g,"–"); }
      else if ((k = f.match(/^rir\s*:?\s*(.+)$/i))) ex.rir = k[1].trim().replace(/-/g,"–");
      else if ((k = f.match(/^rest\s*:?\s*(.+)$/i))) { ex.rest = parseRest(k[1]); ex.restLabel = k[1].trim(); }
      else if ((k = f.match(/^start\s*:?\s*(.+)$/i))) ex.start = k[1].trim();
      else if ((k = f.match(/^muscles?\s*:?\s*(.+)$/i))) ex.muscles = parseMuscles(k[1]);
      else P.errors.push(`Line ${i+1}: didn't understand "${f}"`);
    });
    day.exercises.push(ex);
  });
  P.notes = notes.join("\n").trim();
  if (!P.days.length) P.errors.push("No training days found. Start each day with a line like: ## Upper A");
  return P;
}
function currentWeek(P, dateISO){
  if (!P.start) return null;
  const diff = Math.floor((parseISO(dateISO || todayISO()) - parseISO(P.start)) / 86400000);
  if (diff < 0) return {week: 0, phase: null};
  const week = Math.floor(diff/7) + 1;
  return {week, phase: P.phases.find(p => week >= p.from && week <= p.to) || null};
}
function phaseSets(sets, phase){
  if (!phase || !phase.sets) return sets;
  const {op, v} = phase.sets;
  if (op === "-") return Math.max(1, sets - v);
  if (op === "+") return sets + v;
  if (op === "x") return Math.max(1, Math.round(sets * v));
  return sets;
}
function startKg(start){
  if (!start || /^bw/i.test(start) || /find/i.test(start)) return null;
  const m = start.match(/([\d.]+)/); return m ? +m[1] : null;
}

/* ---------- state ---------- */
const S = {
  db: null, cloud: "connecting",
  programText: null, P: parseProgram(DEFAULT_PROGRAM), programVersionLoaded: false,
  sessions: new Map(), loaded: false,
  tab: "today", editingId: null, previewDay: null, historyProgram: null, progressProgram: null, programView: null, archive: new Map(), openMenu: null,
  progressEx: null, metric: "top", editProgram: false,
};
const localEdits = new Map(); // id -> updatedAt of local edit not yet confirmed

/* ---------- storage ---------- */
const LS_KEY = "gymlog_fallback_v1";
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch(e){ return null; } }
function lsSave(){ if (S.db) return; try { localStorage.setItem(LS_KEY, JSON.stringify({program: S.programText, sessions: [...S.sessions.values()]})); } catch(e){} }

function setSaveState(kind, text){
  const el = $("#savestate");
  el.innerHTML = `<span class="dot ${kind}"></span><span>${esc(text)}</span>`;
}
const Q = {timers:{}, inflight:{}, dirty:{}};
let pendingCount = 0;
function queueSave(s){
  s.updatedAt = Date.now();
  S.sessions.set(s.id, s);
  localEdits.set(s.id, s.updatedAt);
  if (!S.db) { lsSave(); setSaveState("err", "This device only"); return; }
  clearTimeout(Q.timers[s.id]);
  setSaveState("busy", "Saving…");
  Q.timers[s.id] = setTimeout(() => flush(s.id), 600);
}
async function flush(id, attempt = 0){
  if (Q.inflight[id]) { Q.dirty[id] = true; return; }
  const s = S.sessions.get(id); if (!s) return;
  Q.inflight[id] = true; pendingCount++;
  try {
    await S.db.doc("sessions/" + id).set(clone(s));
    --pendingCount;
  } catch (e) {
    pendingCount--;
    if ((e.code === "unavailable" || !e.code) && attempt < 3) { setTimeout(() => flush(id, attempt + 1), 1200 + Math.random()*1500); setSaveState("busy", "Retrying…"); }
    else setSaveState("err", e.code === "quota_exceeded" ? "Storage full" : "Not saved: " + (e.code || "error"));
  } finally {
    Q.inflight[id] = false;
    if (Q.dirty[id]) { Q.dirty[id] = false; flush(id); }
  }
}
async function deleteSession(id){
  S.sessions.delete(id); localEdits.delete(id);
  clearTimeout(Q.timers[id]);
  if (!S.db) { lsSave(); return; }
  try { await S.db.doc("sessions/" + id).delete(); }
  catch(e){ setSaveState("err", "Delete failed"); }
}
const slugOf = n => (String(n).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "program").slice(0, 80);
async function saveProgram(text){
  const oldText = S.programText, oldName = S.P.name;
  S.programText = text; S.P = parseProgram(text);
  if (!S.db) { lsSave(); return true; }
  setSaveState("busy", "Saving…");
  try {
    // renaming the current program starts a new block: keep the old plan in the archive
    if (oldText && oldName && oldName !== S.P.name) await S.db.doc("programs/" + slugOf(oldName)).set({name: oldName, text: oldText, archivedAt: Date.now()});
    await S.db.doc("program/current").set({text, updatedAt: Date.now()}); return true;
  }
  catch(e){ setSaveState("err", "Program not saved"); return false; }
}
async function saveArchived(id, text){
  const P = parseProgram(text), a = S.archive.get(id);
  if (!S.db || !a) return false;
  setSaveState("busy", "Saving…");
  try { await S.db.doc("programs/" + id).set({name: a.name, text, updatedAt: Date.now()}); a.text = text; return true; }
  catch(e){ setSaveState("err", "Program not saved"); return false; }
}

/* ---------- boot ---------- */
const SUPABASE_URL = "https://zidbosdaiaajzmzkuzof.supabase.co";
const SUPABASE_KEY = "sb_publishable_8z5YFYTrO4kWsWqym2GaQw_lQuFcNAu"; // publishable key: safe in the browser, data is protected by row-level security
let SB = null;

  if (!window.supabase) { $("#view").innerHTML = `<div class="empty">Couldn't load. Check your connection and open the app again.</div>`; return; }

  if (session) startWith(session.user); else renderLogin();
}
function renderLogin(msg){

async function loadLastBackup(){
  try { const {data} = await SB.from("document_backups").select("taken_at").order("taken_at", {ascending: false}).limit(1);
    S.lastBackup = data && data[0] ? data[0].taken_at : null; if (S.tab === "program") softRender(); } catch(e){}
}

/* ---------- keyboard recorder: notes what happened when a field loses focus ---------- */
const KB = {renders: [], events: [], vv: [], saveT: null};
function kbLog(type, extra){
  KB.events.push(Object.assign({t: Date.now(), type, vis: document.visibilityState, vh: window.visualViewport ? Math.round(visualViewport.height) : null, ih: innerHeight}, extra || {}));
  if (KB.events.length > 40) KB.events.shift();
  clearTimeout(KB.saveT); KB.saveT = setTimeout(kbSave, 1500);
}
async function kbSave(){
  try { if (!SB || !S.user) return; await SB.from("documents").upsert({user_id: S.user.id, collection: "debug", id: "keyboard", data: {ua: navigator.userAgent, standalone: matchMedia("(display-mode: standalone)").matches, at: new Date().toISOString(), events: KB.events, renders: KB.renders, vv: KB.vv.slice(-30)}, updated_at: new Date().toISOString()}); } catch(e){}
}
document.addEventListener("focusin", e => { const t = e.target; if (t.dataset && t.dataset.f) kbLog("focus", {field: t.dataset.f}); });
document.addEventListener("focusout", e => {
  const t = e.target; if (!(t.dataset && t.dataset.f)) return;
  const lastR = KB.renders[KB.renders.length - 1];
  kbLog("blur", {field: t.dataset.f, len: (t.value || "").length, inDom: document.contains(t), to: e.relatedTarget ? (e.relatedTarget.tagName + "." + (e.relatedTarget.className || "")) : null, msSinceRender: lastR ? Date.now() - lastR.t : null, saveState: ($("#savestate") || {}).textContent});
});
if (window.visualViewport) visualViewport.addEventListener("resize", () => { KB.vv.push({t: Date.now(), h: Math.round(visualViewport.height), focus: document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.f || document.activeElement.tagName : null}); if (KB.vv.length > 60) KB.vv.shift(); });
document.addEventListener("visibilitychange", () => kbLog("visibility"));
function startWith(user){
  if (S.db) return;
  document.body.classList.remove("signedout");
  S.user = user;
  setTimeout(refreshPush, 3000);
  setTimeout(loadLastBackup, 1500);
  const db = window.makeStore(SB, user.id, st => {
    if (st === "ok") setSaveState("ok", "Saved");
    else if (st === "busy") setSaveState("busy", "Saving…");
    else if (st === "offline") setSaveState("busy", "Offline, saved on phone");
    else setSaveState("busy", "Syncing…");
  });
  S.db = db;
  let gotSessions = false, gotProgram = false;
  const slow = setTimeout(() => { if (!gotSessions || !gotProgram) { setSaveState("busy", "Offline, saved on phone"); S.loaded = true; render(); } }, 10000);
  let firstDone = false;
  const done = () => { if (gotSessions && gotProgram && !firstDone) { firstDone = true; clearTimeout(slow); S.loaded = true; render(); } };
  db.doc("program/current").onSnapshot(snap => {
    if (snap.exists) { const d = snap.data(); if (d.text !== S.programText && !S.editProgram) { S.programText = d.text; S.P = parseProgram(d.text); if (gotProgram) softRender(); } }
    if (!snap.metadata.fromCache) { gotProgram = true; done(); }
  }, e => { gotProgram = true; done(); });
  db.collection("programs").onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => { const x = d.data(); if (x && x.text) m.set(d.id, {id: d.id, name: x.name, text: x.text, at: x.archivedAt || 0}); });
    S.archive = m; if (S.loaded && S.tab === "program") softRender();
  }, () => {});
  db.collection("sessions").onSnapshot(snap => {
    const next = new Map();
    snap.docs.forEach(d => { const data = d.data(); if (data) next.set(d.id, Object.assign(clone(data), {id: d.id})); });
    // keep local versions that are newer than what the store has confirmed
    for (const [id, t] of localEdits) {
      const remote = next.get(id), local = S.sessions.get(id);
      if (local && (!remote || (remote.updatedAt||0) < t)) next.set(id, local);
      else localEdits.delete(id);
    }
    S.sessions = next;
    if (!snap.metadata.fromCache) gotSessions = true;
    if (gotSessions && gotProgram && S.loaded) softRender(); else done();
    if (snap.metadata.fromCache && !S.loaded && snap.size) { S.loaded = true; render(); }
  }, e => { gotSessions = true; setSaveState("err", "Storage error"); done(); });
}
// re-render unless the user is typing in the workout editor
function softRender(){
  const ae = document.activeElement;
  if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.closest("#view")) return; // never steal focus from a field you're typing in
  if (S.editProgram) return;
  const editing = (S.tab === "today" && activeSession()) || S.editingId;
  if (editing && document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (editing) return; // editor owns its state; avoid clobbering scroll
  render();
}

/* ---------- queries ---------- */
const sortedSessions = () => [...S.sessions.values()].sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.startedAt||0) - (a.startedAt||0));
const activeSession = () => sortedSessions().find(s => s.status === "active");
const filledSets = ex => (ex.sets||[]).filter(s => s.kg != null || s.reps != null);
function lastPerf(name, {excludeId, beforeDate, current, needSets}){
  const key = norm(name);
  for (const s of sortedSessions()) {
    if (s.id === excludeId) continue;
    if (beforeDate && s.date > beforeDate) continue;
    const isCur = s.program === S.P.name;
    if (current === true && !isCur) continue;
    if (current === false && isCur) continue;
    const ex = (s.exercises||[]).find(e => norm(e.name) === key);
    if (ex && (filledSets(ex).length || (!needSets && (ex.notes||"").trim()))) return {s, ex, sets: filledSets(ex), isCur};
  }
  return null;
}
// bodyweight exercises: sets store ADDED kg (empty = 0), ex.bw stores body weight; charts use the total
const isBWEx = name => /\b(chin.?ups?|pull.?ups?|dips?|push.?ups?|inverted rows?|muscle.?ups?)\b/i.test(name||"") && !/\b(db|dumbbells?|barbell|machine|cable|press|assisted|band)\b/i.test(name||"");
const loadOf = (ex, st) => isBWEx(ex.name) && ex.bw != null ? ex.bw + (st.kg || 0) : st.kg;
const kgTxt = (name, kg) => isBWEx(name) ? (kg ? "+" + fmtNum(kg) : "BW") : (kg != null ? fmtNum(kg) : "BW");
function lastBW(excludeId){
  for (const s of sortedSessions()) { if (s.id === excludeId) continue; const e = (s.exercises||[]).find(x => x.bw != null); if (e) return e.bw; }

  [/curl/, {Biceps: 1}],

    const m = musclesFor(e.name, plan ? (plan.days.flatMap(d => d.exercises).find(pe => norm(pe.name) === norm(e.name))) : null);

  }));
  if (plan) plan.days.forEach(d => d.exercises.forEach(pe => {
    const n = phaseSets(pe.sets || 0, cw && cw.phase);
    Object.entries(musclesFor(pe.name, pe)).forEach(([k, w]) => planned[k] = (planned[k] || 0) + n * w);
  }));
  const rows = MUSCLES.concat(Object.keys(done).concat(Object.keys(planned)).filter(k => !MUSCLES.includes(k)))
    .filter((k, i, a) => a.indexOf(k) === i && ((done[k] || 0) > 0 || (planned[k] || 0) > 0));
  const max = Math.max(22, ...rows.map(k => Math.max(done[k] || 0, planned[k] || 0)));
  const pct = v => Math.min(100, v / max * 100);
  const f = v => { const r = Math.round(v * 2) / 2; return r % 1 ? String(r).replace(".5", "½") : String(r); };
  const label = `${cw && cw.week ? "Week " + cw.week + ", " : ""}${fmtDate(wk)} – ${fmtDate(end)}`;
  return `<div class="card muscard">
    <div class="row between"><div class="mustitle">Weekly sets per muscle</div></div>
    <div class="row between musnav">
      <button class="iconbtn" data-act="musPrev" ${S.musIdx === 0 ? "disabled" : ""} aria-label="Previous week">‹</button>
      <div class="muswk">${label}</div>
      <button class="iconbtn" data-act="musNext" ${S.musIdx === weeks.length - 1 ? "disabled" : ""} aria-label="Next week">›</button>
    </div>
    ${rows.length ? rows.map(k => `<div class="musrow"><span class="musname">${esc(k)}</span>
      <span class="musbar"><i class="zone" style="left:${pct(10)}%;width:${pct(20) - pct(10)}%"></i><i class="fill" style="width:${pct(done[k] || 0)}%"></i>${planned[k] ? `<i class="plan" style="left:${pct(planned[k])}%"></i>` : ""}</span>
      <span class="musnum">${f(done[k] || 0)}<small>${planned[k] ? " / " + f(planned[k]) : ""}</small></span></div>`).join("") : `<div class="faint small" style="padding:8px 0">No sets logged this week.</div>`}
    <div class="faint small" style="margin-top:10px;line-height:1.5">Done / planned sets. Main muscle counts 1 set, helper muscles ½. Shaded band: 10–20 sets a week. The white tick is the plan.</div>
  </div>`;
}

/* ---------- week picker ---------- */
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function isoOf(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function pickWeek(){
  const P = S.P, cw = currentWeek(P) || {week: 0};
  const total = weeksTotal(P, cw);
  const sh = $("#modalSheet");
  sh.innerHTML = `<h3>Which week are you in?</h3>
    <p class="muted small" style="margin:0">The app counts up a week every Monday from the week you pick. Pick again any time, for example after skipping a week.</p>
    <div class="wkgrid">${Array.from({length: total}, (_, k) => k + 1).map(w => { const ph = P.phases.find(x => w >= x.from && w <= x.to);
      return `<button class="wk ${w === cw.week ? "on" : ""}" data-w="${w}"><b>${w}</b></button>`; }).join("")}
      <button class="wk add" data-w="add" aria-label="Add a week"><b>+</b></button></div>
    <div class="acts">${total > Math.max(cw.week, 1) ? `<button class="btn ghost" data-w="remove">Remove week ${total}</button>` : ""}<button class="btn ghost" data-w="cancel">Close</button></div>`;
  $("#modal").style.display = "flex";
  sh.querySelectorAll("[data-w]").forEach(b => b.onclick = async () => {
    $("#modal").style.display = "none";
    const w = b.dataset.w; if (w === "cancel" || +w === cw.week) return;
    if (w === "add" || w === "remove") {
      const len = total + (w === "add" ? 1 : -1);
      let text = S.programText || DEFAULT_PROGRAM;
      if (/^length\s*:.*$/im.test(text)) text = text.replace(/^length\s*:.*$/im, "Length: " + len + " weeks");
      else if (/^start\s*:.*$/im.test(text)) text = text.replace(/^(start\s*:.*)$/im, "$1\nLength: " + len + " weeks");
      else text = "Length: " + len + " weeks\n" + text;
      if (await saveProgram(text)) { render(); pickWeek(); }
      return;
    }
    const start = mondayOf(new Date()); start.setDate(start.getDate() - (+w - 1) * 7);
    const iso = isoOf(start);
    let text = S.programText || DEFAULT_PROGRAM;
    if (/^start\s*:.*$/im.test(text)) text = text.replace(/^start\s*:.*$/im, "Start: " + iso);
    else if (/^program\s*:.*$/im.test(text)) text = text.replace(/^(program\s*:.*)$/im, "$1\nStart: " + iso);
    else text = "Start: " + iso + "\n" + text;
    if (await saveProgram(text)) { render(); toast("You're in week " + w); }
  });
}


/* ---------- rest alerts on the lock screen (web push) + screen stays awake ---------- */
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const pushOn = () => pushSupported() && Notification.permission === "granted" && localStorage.getItem("gb_push") === "1";
async function alarmSet(){
  if (!SB || !S.user || !pushOn() || T.end <= Date.now()) return;
  T.alarm = true;
  try { await SB.from("rest_alarms").upsert({user_id: S.user.id, id: "current", fire_at: new Date(T.end).toISOString(), title: "Rest done", body: T.label || "Time for the next set"}); } catch(e){}
}

}
function b64ToBytes(b64){ const p = "=".repeat((4 - b64.length % 4) % 4), raw = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
async function subscribePush(){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    const sess = (await SB.auth.getSession()).data.session;
    const r = await fetch(SUPABASE_URL + "/functions/v1/rest-push?action=key", {headers: {Authorization: "Bearer " + sess.access_token, apikey: SUPABASE_KEY}});
    const {publicKey} = await r.json();
    sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey)});
  }
  const j = sub.toJSON();
  const {error} = await SB.from("push_subscriptions").upsert({user_id: S.user.id, endpoint: j.endpoint, subscription: j});
  if (error) throw error;
}
async function enablePush(){

}

    const list = groups.get(k) || [], cur = k === S.P.name;

  if (S.editProgram) return renderProgramEdit();
  if (S.programView == null) return renderProgramList2();
  if (S.programView === S.P.name) return backBtn() + renderProgram(S.P, true);
  const a = [...S.archive.values()].find(x => x.name === S.programView);
  if (a) return backBtn() + renderProgram(parseProgram(a.text), false, a.id);
  const list = sessionsOf(S.programView);
  return backBtn() + `<div class="title2">${esc(S.programView)}</div><div class="card empty" style="margin-top:14px">No plan saved for this program, only its ${list.length} logged sessions.</div>`;
}
const backBtn = () => `<button class="btn sm ghost" data-act="progBack" style="margin:-4px 0 10px -10px">‹ All programs</button>`;
function renderProgramList2(){
  const names = [S.P.name];
  const others = new Map();
  [...S.archive.values()].forEach(a => { if (a.name !== S.P.name) others.set(a.name, a.at || 0); });
  sortedSessions().forEach(x => { if (x.program && x.program !== S.P.name) { const t = parseISO(x.date).getTime(); others.set(x.program, Math.max(others.get(x.program) || 0, t)); } });
  [...others.entries()].sort((a, b) => b[1] - a[1]).forEach(([n]) => names.push(n));
  const cw = currentWeek(S.P);
  return names.map((n, i) => {
    const cur = i === 0, list = sessionsOf(n), hasPlan = cur || [...S.archive.values()].some(a => a.name === n);
    const sub = cur ? (cw && cw.week ? `Week ${cw.week}, started ${fmtDate(S.P.start)}` : S.P.start ? `Starts ${fmtDate(S.P.start, true)}` : "")
      : [list.length ? `${list.length} sessions, ${rangeOf(list)}` : "", hasPlan ? "" : "no plan saved"].filter(Boolean).join(", ");
    return `<button class="card daycard ${cur ? "suggest" : ""}" data-act="progOpen" data-p="${esc(n)}">
      <div><div class="t">${esc(n)}</div><div class="sub">${sub}</div></div>
      ${cur ? `<span class="next">Current</span>` : ""}<span class="chev">›</span></button>`;
  }).join("") + `<p class="faint small" style="margin:14px 4px">To start a new program, open the current one, tap Edit and change its name on the first line. The old plan moves here automatically.</p>
  <h2>Account</h2>
  <div class="card"><div class="muted small" style="margin-bottom:12px">Signed in as ${esc(S.user ? S.user.email : "")}</div>
    <div class="row between" style="margin-bottom:12px"><div><div style="font-weight:600">Rest alerts on the lock screen</div><div class="faint small">${!pushSupported() ? "Not supported in this browser" : Notification.permission === "denied" ? "Blocked in Android settings" : pushOn() ? "On" : "Off"}</div></div>
      ${pushSupported() && Notification.permission !== "denied" ? (pushOn() ? `<button class="btn sm ghost" data-act="pushOff">Turn off</button>` : `<button class="btn sm" data-act="pushOn">Turn on</button>`) : ""}</div>
    <div class="row between" style="margin-bottom:12px"><div><div style="font-weight:600">Automatic backup</div><div class="faint small">Every Sunday night, last 8 weeks kept${S.lastBackup ? `. Last: ${fmtDate(S.lastBackup.slice(0, 10), true)}` : ""}</div></div></div>
    <button class="btn block" data-act="exportBackup">Export a copy to this phone</button>
    <button class="btn block ghost" data-act="signOut" style="margin-top:8px">Sign out</button></div>`;
}
function renderProgram(P, isCur, archiveId){
  const cw = isCur ? currentWeek(P) : null, list = sessionsOf(P.name);
  const sub = isCur ? (P.start ? `Started ${fmtDate(P.start, true)}${cw && cw.week ? `, now in week ${cw.week}` : ""}` : "")
    : (list.length ? `${list.length} sessions, ${rangeOf(list)}` : "");
  let h = `<div class="card"><div class="row between" style="align-items:flex-start"><div><div class="title2" style="font-size:30px;margin-bottom:6px">${esc(P.name)}</div>${sub ? `<div class="muted small">${sub}</div>` : ""}</div>
    <button class="btn sm" data-act="editProgram" data-id="${esc(archiveId || "")}">Edit</button></div>
    ${P.phases.length ? `<div style="margin-top:10px">${P.phases.map(ph => `<div class="phase ${cw && cw.phase === ph ? "cur" : ""}"><span class="w">${ph.from === ph.to ? "Week " + ph.from : ph.to === 9999 ? "Week " + ph.from + "+" : "Weeks " + ph.from + "–" + ph.to}</span><span>${esc(ph.label)}${ph.sets ? ` <span class="faint">(sets ${ph.sets.op === "x" ? "×" : ph.sets.op}${ph.sets.v})</span>` : ""}</span></div>`).join("")}</div>` : ""}
  </div>`;
  P.days.forEach(d => {
    h += `<h2><span style="font:700 22px var(--cond);color:var(--ink)">${esc(d.name)}</span>${d.subtitle ? ` <span class="faint">${esc(d.subtitle)}</span>` : ""}</h2><div class="card">`;
    d.exercises.forEach(e => {
      h += `<div class="pex"><span>${e.label ? `<span class="lbl ${e.group ? "" : "plain"}">${esc(e.label)}</span>` : ""}</span><span class="nm">${esc(e.name)}</span><span class="s">${e.sets} × ${esc(e.reps)}</span>
        <span class="sub">${[e.rir ? "RIR " + esc(e.rir) : "", e.restLabel ? "rest " + esc(e.restLabel) : "", e.start ? "start " + esc(e.start) : ""].filter(Boolean).join(", ")}${e.tip ? `<br><i>${esc(e.tip)}</i>` : ""}</span></div>`;
    });
    h += `</div>`;
  });
  if (P.notes) h += `<h2>Notes</h2><div class="card"><pre class="notes">${esc(P.notes)}</pre></div>`;
  return h;
}
function renderProgramEdit(){
  return `<p class="muted small" style="margin-top:0">${S.editProgram === "current" ? "Edit the plan as text. Changing the name on the first line starts a new program: this plan and its sessions are kept under the old name." : "Edit this past program's plan. Keep the name on the first line as it is, so it stays linked to its sessions."}</p>
    <textarea class="code" id="progText" spellcheck="false">${esc(S.editProgram === "current" ? (S.programText || DEFAULT_PROGRAM) : ((S.archive.get(S.editProgram) || {}).text || ""))}</textarea>
    <div id="progErr" class="err"></div>
    <div class="row" style="gap:8px;margin-top:6px"><button class="btn ghost" data-act="cancelProgram">Cancel</button><button class="btn primary" style="flex:1" data-act="saveProgram">Save program</button></div>
    <details><summary>Format guide</summary><div class="card small muted" style="line-height:1.6">
      <b>Program: Name</b> · <b>Start: 2026-11-09</b> · <b>Length: 16 weeks</b><br>
      <b>Week 1: Ramp-up | sets -1</b> · <b>Week 7: Deload | sets x0.5</b> · <b>Week 14+: …</b><br>
      <b>## Upper A — chest focus</b> starts a day<br>
      <b>1. Bench | 4x5 | RIR 2 | rest 3:00 | start: 80 kg</b><br>
      <b>5A. / 5B.</b> = superset (timer starts after B)<br>
      <b>&gt; cue text</b> under an exercise adds a tip<br>
      <b># Notes</b> — everything after is free text
    </div></details>`;
}

render();
boot();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
